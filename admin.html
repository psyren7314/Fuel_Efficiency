<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>車種管理ページ</title>
    <script src="config.js"></script><script src="credentials.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #f2f2f7; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 550px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { font-size: 22px; margin-top: 0; }
        .card { background:#f9f9f9; padding:15px; border-radius:10px; margin-bottom:20px; border: 1px solid #eee; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .input-group input, .input-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; background-color: #fff; }
        button { width: 100%; padding: 12px; background-color: #34c759; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
        .car-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; align-items: center; background-color: #fff; margin-bottom: 5px; border-radius: 8px; }
        .order-input { width: 50px !important; text-align: center; margin-right: 10px; }
        .toggle-btn { width: auto; padding: 6px 12px; font-size: 12px; font-weight: bold; background-color: #007aff; border: none; border-radius: 6px; color: white; cursor: pointer; }
        .toggle-btn.off { background-color: #8e8e93; }
        .delete-btn { width: auto; padding: 6px 12px; background-color: #ff3b30; font-size: 12px; }
        .user-tab { background-color: #007aff; color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="container" id="loginPanel">
    <h1>管理者ログイン</h1>
    <div class="input-group"><label>管理者ID</label><input type="text" id="userId" placeholder="admin"></div>
    <div class="input-group"><label>パスワード</label><input type="password" id="userPw"></div>
    <button onclick="login()">ログイン</button>
</div>

<div class="container" id="adminPanel" style="display:none;">
    <h1>⚙️ 特権車種管理システム（決定版）</h1>

    <div class="card">
        <h3>1. 車両マスター登録（全ユーザー共通の車を追加）</h3>
        <div class="input-group"><label>共通車両名</label><input type="text" id="masterCarName" placeholder="例: プリウス"></div>
        <div class="input-group"><label>指定油種</label><select id="masterFuel"><option>レギュラー</option><option>ハイオク</option><option>軽油</option></select></div>
        <button onclick="addMasterCar()">共通マスターに登録</button>
        <ul id="masterList" style="list-style:none; padding:0; font-size:14px; color:#555;"></ul>
    </div>

    <div class="user-tab">
        <label>2. 表示順・表示切替を設定する対象ユーザー</label>
        <select id="targetUser" onchange="updateSettingsUI()" style="width:100%; margin-top:5px; padding:8px; border-radius:5px;">
            </select>
    </div>

    <h3>3. 選択中ユーザーへの表示・並び順の個別設定</h3>
    <p style="font-size:12px; color:#8e8e93; margin-top:-10px;">※順序の数字を入力して枠外をタップすると即時並び順が保存されます。</p>
    <div id="settingList"></div>
    
    <button style="background:#8e8e93; margin-top:30px;" onclick="location.href='index.html'">メインページに戻る</button>
</div>

<script>
    let supabaseClient; let masterCars = [];
    function cleanConfigStr(str) { return str ? str.trim().replace(/\s+/g, '').replace(/\/$/, '') : ''; }
    
    // ⭕ credentials.js から実際のIDを読み込んでプルダウンを動的生成する
    function setupUserDropdown() {
        const selector = document.getElementById('targetUser');
        selector.innerHTML = '';
        
        const addOption = (id, label) => {
            if (typeof id !== 'undefined' && id) {
                const val = id.trim().toLowerCase();
                selector.innerHTML += `<option value="${val}">${label} (ID: ${val})</option>`;
            }
        };
        
        addOption(typeof ADMIN_ID !== 'undefined' ? ADMIN_ID : 'admin', '管理者');
        addOption(typeof USER_ID !== 'undefined' ? USER_ID : '', 'ユーザー1');
        addOption(typeof USER2_ID !== 'undefined' ? USER2_ID : '', 'ユーザー2');
    }

    window.addEventListener('DOMContentLoaded', () => { 
        supabaseClient = window.supabase.createClient(cleanConfigStr(SUPABASE_CONFIG_URL), cleanConfigStr(SUPABASE_CONFIG_ANON_KEY)); 
        setupUserDropdown();
    });

    async function hash(pw) {
        const msgUint8 = new TextEncoder().encode(pw);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function login() {
        if (typeof ADMIN_ID === 'undefined') { alert("⚠️ 認証同期中。数秒お待ちください。"); return; }
        const id = document.getElementById('userId').value.trim(); const pw = document.getElementById('userPw').value;
        if (id.toLowerCase() === ADMIN_ID.toLowerCase() && await hash(pw) === ADMIN_PW_HASH) {
            document.getElementById('loginPanel').style.display = 'none'; document.getElementById('adminPanel').style.display = 'block';
            refreshAll();
        } else { alert("管理者権限がありません"); }
    }

    async function refreshAll() {
        if (!supabaseClient) return;
        const { data, error } = await supabaseClient.from('cars').select('*').order('id');
        if (!error) {
            masterCars = data || [];
            updateMasterListUI();
            updateSettingsUI();
        }
    }

    function updateMasterListUI() {
        const list = document.getElementById('masterList');
        if (masterCars.length === 0) { list.innerHTML = '<li>登録された共通車両はありません</li>'; return; }
        list.innerHTML = masterCars.map(c => `<li>・<strong>${c.name}</strong> (${c.fuel_type}) <a href="#" style="color:red; font-size:10px;" onclick="deleteMasterCar(${c.id})">[完全に削除]</a></li>`).join('');
    }

    async function addMasterCar() {
        const name = document.getElementById('masterCarName').value.trim(); const fuel = document.getElementById('masterFuel').value;
        if (!name || !supabaseClient) return;
        await supabaseClient.from('cars').insert([{ name, fuel_type: fuel, user_settings: {} }]);
        document.getElementById('masterCarName').value = ''; refreshAll();
    }

    async function deleteMasterCar(id) { 
        if(!supabaseClient) return;
        if(confirm('この車を共通マスターから完全に削除しますか？すべてのユーザーの設定も消えます。')){ 
            await supabaseClient.from('cars').delete().eq('id', id); refreshAll(); 
        } 
    }

    function updateSettingsUI() {
        const target = document.getElementById('targetUser').value.toLowerCase();
        const container = document.getElementById('settingList'); container.innerHTML = '';
        
        if (masterCars.length === 0) {
            container.innerHTML = '<p style="color:#8e8e93; font-size:14px;">まず上記の車両マスターに車を登録してください。</p>';
            return;
        }

        masterCars.forEach(car => {
            let settings = car.user_settings || {};
            if (typeof settings === 'string') {
                try { settings = JSON.parse(settings); } catch(e) { settings = {}; }
            }
            
            const normalizedSettings = {};
            Object.keys(settings).forEach(k => { normalizedSettings[k.toLowerCase()] = settings[k]; });

            const myConfig = normalizedSettings[target] || { order: 1, show: false };
            const visible = myConfig.show === true;
            const order = myConfig.order || 1;

            container.innerHTML += `
                <div class="car-item">
                    <div>
                        <input type="number" class="order-input" value="${order}" onchange="saveConfig(${car.id}, this.value, ${visible})">
                        <strong>${car.name}</strong> <span style="font-size:12px; color:#8e8e93;">(${car.fuel_type})</span>
                    </div>
                    <div>
                        <button class="toggle-btn ${visible ? '' : 'off'}" onclick="saveConfig(${car.id}, ${order}, ${!visible})">
                            ${visible ? '🟢 表示中' : '🔘 非表示'}
                        </button>
                    </div>
                </div>`;
        });
    }

    async function saveConfig(id, order, visible) {
        if (!supabaseClient) return;
        const target = document.getElementById('targetUser').value.toLowerCase();
        
        const originalCar = masterCars.find(c => c.id === id);
        if (!originalCar) return;

        let currentSettings = originalCar.user_settings || {};
        if (typeof currentSettings === 'string') {
            try { currentSettings = JSON.parse(currentSettings); } catch(e) { currentSettings = {}; }
        }

        const newSettings = {};
        Object.keys(currentSettings).forEach(k => { newSettings[k.toLowerCase()] = currentSettings[k]; });

        newSettings[target] = {
            order: parseInt(order) || 1,
            show: visible
        };

        await supabaseClient.from('cars').update({ user_settings: newSettings }).eq('id', id);
        refreshAll();
    }
</script>
</body>
</html>
