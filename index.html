<!DOCTYPE html>
<script>
    // アップデート時は下の番号を変更してください
    const APP_VERSION = "#45";
</script>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>燃費計算</title>
    <script> document.title = "燃費計算 (" + APP_VERSION + ")"; </script>
    <script src="config.js"></script>
    <script src="credentials.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary-color: #007aff; --bg-color: #f2f2f7; --card-bg: #ffffff; --text-color: #1c1c1e; --accent-color: #34c759; --warning-color: #ff9500; --danger-color: #ff3b30; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; }
        .login-panel { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-top: 40px; }
        .login-panel h2 { margin-top: 0; margin-bottom: 20px; font-size: 22px; text-align: center; }
        #mainApp { display: none; }
        .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        h1 { font-size: 26px; margin: 0; font-weight: 700; }
        .commit-badge { font-size: 14px; color: #8e8e93; font-weight: normal; margin-left: 8px; }
        .admin-link { font-size: 14px; color: var(--primary-color); text-decoration: none; font-weight: bold; background-color: #e5f1ff; padding: 5px 10px; border-radius: 8px; }
        .car-selector-card { background-color: #34c759; color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; box-shadow: 0 4px 6px rgba(52, 199, 89, 0.2); }
        .car-selector-card label { font-weight: bold; margin-right: 15px; }
        .car-selector-card select { flex: 1; padding: 8px; border-radius: 6px; border: none; font-size: 16px; font-weight: bold; }
        .status-bar { font-size: 14px; color: #8e8e93; margin-bottom: 15px; display: flex; align-items: center; gap: 5px; }
        .status-badge { font-weight: 600; padding: 2px 8px; border-radius: 20px; font-size: 12px; }
        .status-connecting { background-color: #ffe5cc; color: var(--warning-color); }
        .status-connected { background-color: #e5f9eb; color: var(--accent-color); }
        .status-disconnected { background-color: #ffe5e5; color: var(--danger-color); }
        .status-error-text { font-size: 13px; color: var(--danger-color); background-color: #fff2f2; border-left: 3px solid var(--danger-color); padding: 10px 12px; border-radius: 6px; margin-bottom: 20px; display: none; word-break: break-all; font-family: monospace; line-height: 1.4; }
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card-title { font-size: 18px; font-weight: 600; margin-top: 0; margin-bottom: 15px; }
        .input-group { display: flex; align-items: center; margin-bottom: 15px; position: relative; }
        .input-group label { width: 90px; font-weight: 500; }
        .input-group input, .input-group select { flex: 1; padding: 10px; border: 1px solid #d1d1d6; border-radius: 8px; font-size: 16px; background-color: #fafafc; outline: none; box-sizing: border-box; }
        .input-group select { padding-right: 30px; -webkit-appearance: none; appearance: none; }
        .input-group .unit { width: 45px; text-align: right; color: #8e8e93; font-size: 14px; }
        button.primary-btn { width: 100%; padding: 14px; background-color: var(--primary-color); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        button.primary-btn:active { opacity: 0.8; }
        .record-list { list-style: none; padding: 0; margin: 0; }
        .record-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #e5e5ea; }
        .record-item:last-child { border-bottom: none; }
        .record-info .date { font-size: 12px; color: #8e8e93; margin-bottom: 4px; }
        .record-info .details { font-size: 14px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
        .fuel-tag { font-size: 11px; font-weight: 600; color: var(--accent-color); background-color: #e5f9eb; padding: 1px 6px; border-radius: 4px; }
        .record-info .cost-tag { color: #555; font-weight: 600; background-color: #f2f2f7; padding: 1px 5px; border-radius: 4px; }
        .record-efficiency { display: flex; align-items: center; gap: 15px; }
        .efficiency-val { font-size: 18px; font-weight: 700; color: var(--accent-color); }
        .delete-btn { background: none; color: #ff3b30; border: none; padding: 5px; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <div id="loginAuthPanel" class="login-panel">
        <h2>🔒 燃費計算アプリ 認証</h2>
        <div class="input-group"><label>ユーザーID</label><input type="text" id="siteUserId" placeholder="IDを入力"></div>
        <div class="input-group"><label>パスワード</label><input type="password" id="siteUserPw" placeholder="パスワードを入力"></div>
        <button class="primary-btn" onclick="authenticateSite()">ログイン</button>
    </div>
    <div id="mainApp">
        <div class="header-area">
            <h1>燃費計算<span class="commit-badge"><script>document.write(APP_VERSION);</script></span></h1>
            <a href="admin.html" class="admin-link">⚙️ 車種管理</a>
        </div>
        <div class="status-bar">通信状態: <span id="connectionStatus" class="status-badge status-connecting">🟡 接続中...</span></div>
        <div id="statusErrorDisplay" class="status-error-text"></div>
        <div class="car-selector-card"><label for="mainCarSelector">対象車両</label><select id="mainCarSelector" onchange="loadRecords()"></select></div>
        <div class="card">
            <div class="card-title">新規記録</div>
            <div class="input-group"><label for="distance">走行距離</label><input type="number" id="distance" step="0.1" placeholder="例: 450.5"><span class="unit">km</span></div>
            <div class="input-group"><label for="amount">給油量</label><input type="number" id="amount" step="0.1" placeholder="例: 35.0"><span class="unit">L</span></div>
            <div class="input-group"><label for="price">ガソリン単価</label><input type="number" id="price" step="1" placeholder="例: 165"><span class="unit">円/L</span></div>
            <button class="primary-btn" onclick="saveRecord()">データを計算・サーバーへ保存</button>
        </div>
        <div class="card"><div class="card-title">燃費記録履歴</div><ul id="recordList" class="record-list"></ul></div>
    </div>
</div>
<script>
    let supabaseClient; let records = []; let carObjects = []; let currentLoginUser = '';
    function cleanConfigStr(str) { return str ? str.trim().replace(/\s+/g, '').replace(/\/$/, '') : ''; }
    async function calcHash(password) {
        const msgUint8 = new TextEncoder().encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    async function authenticateSite() {
        if (typeof USER_ID === 'undefined') { alert("⚠️ 認証キー同期中。数秒お待ちください。"); return; }
        const id = document.getElementById('siteUserId').value.trim(); const pw = document.getElementById('siteUserPw').value; const hash = await calcHash(pw);
        let valid = false;
        if (id === ADMIN_ID && hash === ADMIN_PW_HASH) valid = true;
        else if (id === USER_ID && hash === USER_PW_HASH) valid = true;
        else if (typeof USER2_ID !== 'undefined' && id === USER2_ID && hash === USER2_PW_HASH) valid = true;
        if (valid) {
            currentLoginUser = id; sessionStorage.setItem('currentFuelAppUser', id);
            document.getElementById('loginAuthPanel').style.display = 'none'; document.getElementById('mainApp').style.display = 'block';
            initializeSupabase();
        } else { alert("認証に失敗しました"); }
    }
    function updateStatusDisplay(type, text, errorMsg = '') {
        const badge = document.getElementById('connectionStatus'); const errDisp = document.getElementById('statusErrorDisplay');
        if (badge) { badge.innerText = text; badge.className = 'status-badge status-' + type; }
        if (errDisp) { if (errorMsg) { errDisp.innerText = "⚠️ エラー: " + errorMsg; errDisp.style.display = 'block'; } else { errDisp.style.display = 'none'; } }
    }
    async function initializeSupabase() {
        try {
            const cleanUrl = cleanConfigStr(SUPABASE_CONFIG_URL); const cleanKey = cleanConfigStr(SUPABASE_CONFIG_ANON_KEY);
            supabaseClient = window.supabase.createClient(cleanUrl, cleanKey);
            await fetchCars(); loadRecords();
        } catch (e) { updateStatusDisplay('disconnected', '🔴 初期化失敗', e.message); }
    }

    // ⭕ 変更：全車両の中から、JSON(user_settings)の中に「自分のIDの設定があり、かつ表示ON」のものだけを並び順通りに抽出！
    async function fetchCars() {
        if (!supabaseClient) return;
        const { data, error } = await supabaseClient.from('cars').select('*');
        const selector = document.getElementById('mainCarSelector'); selector.innerHTML = '';
        
        if (!error && data) {
            carObjects = [];
            data.forEach(car => {
                const settings = car.user_settings || {};
                const myConfig = settings[currentLoginUser];
                // 自分が「表示ON」に設定している場合のみリストに並べる
                if (myConfig && myConfig.show === true) {
                    carObjects.push({
                        name: car.name,
                        fuel_type: car.fuel_type,
                        order: parseInt(myConfig.order) || 1
                    });
                }
            });
            
            // 自分の指定した並び順（order）の小さい順にソートしてプルダウンにセット
            carObjects.sort((a, b) => a.order - b.order);
            
            if (carObjects.length > 0) {
                carObjects.forEach(car => { selector.innerHTML += `<option value="${car.name}">${car.name}</option>`; });
            } else { selector.innerHTML = `<option value="未設定">表示設定された車両なし</option>`; }
        } else { selector.innerHTML = `<option value="未設定">表示設定された車両なし</option>`; }
    }

    async function loadRecords() {
        if (!supabaseClient) return;
        const currentCar = document.getElementById('mainCarSelector').value;
        if (!currentCar || currentCar === '未設定') { updateStatusDisplay('connected', '🟢 接続完了 (車両未設定)'); return; }
        try {
            const { data, error } = await supabaseClient.from('fuel_records').select('*').eq('car_name', currentCar).eq('owner_id', currentLoginUser).order('id', { ascending: false });
            if (!error) { records = data || []; updateLayout(); updateStatusDisplay('connected', '🟢 接続完了'); }
        } catch (error) { updateStatusDisplay('disconnected', '🔴 通信エラー', error.message); }
    }
    function updateLayout() {
        const list = document.getElementById('recordList'); list.innerHTML = '';
        if (records.length === 0) { list.innerHTML = '<li style="text-align:center; color:#8e8e93; padding:20px 0;">記録なし</li>'; return; }
        records.forEach((record) => {
            let fuelTag = `<span class="fuel-tag">${record.fuel_type}</span>`;
            let costTag = `<span class="cost-tag">${Math.round(record.total_cost || 0).toLocaleString()}円</span>`;
            list.innerHTML += `<li class="record-item"><div class="record-info"><div class="date">${record.date}</div><div class="details"><span>${record.distance}km / ${record.amount}L</span>${fuelTag}${costTag}</div></div><div class="record-efficiency"><span class="efficiency-val">${Number(record.efficiency).toFixed(2)} km/L</span><button class="delete-btn" onclick="deleteRecord(${record.id})">削除</button></div></li>`;
        });
    }
    async function saveRecord() {
        const dist = parseFloat(document.getElementById('distance').value); const amnt = parseFloat(document.getElementById('amount').value); let prc = parseFloat(document.getElementById('price').value) || 0;
        const carName = document.getElementById('mainCarSelector').value;
        if (!carName || carName === '未設定') return alert('有効な車両が選択されていません。');
        if (isNaN(dist) || dist <= 0 || isNaN(amnt) || amnt <= 0) return alert('数値が正しくありません。');
        const carObj = carObjects.find(c => c.name === carName); const fuel = carObj ? carObj.fuel_type : 'レギュラー';
        const now = new Date(); const dStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        const newRec = { date: dStr, distance: dist, amount: amnt, price: prc, total_cost: prc * amnt, fuel_type: fuel, efficiency: dist / amnt, car_name: carName, owner_id: currentLoginUser };
        const { error } = await supabaseClient.from('fuel_records').insert([newRec]);
        if (!error) { document.getElementById('distance').value = ''; document.getElementById('amount').value = ''; loadRecords(); }
    }
    async function deleteRecord(id) { if (confirm('削除しますか？')) { await supabaseClient.from('fuel_records').delete().eq('id', id); loadRecords(); } }
</script>
</body>
</html>
