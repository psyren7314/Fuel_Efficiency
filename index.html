<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>燃費計算 (#3)</title>
    <style>
        :root {
            --primary-color: #007aff;
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-color: #1c1c1e;
            --accent-color: #34c759;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .commit-badge {
            font-size: 16px;
            color: #8e8e93;
            font-weight: normal;
            margin-left: 10px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .input-group label {
            width: 90px;
            font-weight: 500;
        }

        .input-group input {
            flex: 1;
            padding: 10px;
            border: 1px solid #d1d1d6;
            border-radius: 8px;
            font-size: 16px;
            background-color: #fafafc;
        }

        .input-group .unit {
            width: 40px;
            text-align: right;
            color: #8e8e93;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        .record-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e5e5ea;
        }

        .record-item:last-child {
            border-bottom: none;
        }

        .record-info .date {
            font-size: 12px;
            color: #8e8e93;
            margin-bottom: 4px;
        }

        .record-info .details {
            font-size: 14px;
        }

        .record-efficiency {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .efficiency-val {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-color);
        }

        .delete-btn {
            background: none;
            color: #ff3b30;
            border: none;
            padding: 5px;
            font-size: 14px;
            cursor: pointer;
            width: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>燃費計算<span class="commit-badge">#3</span></h1>

    <div class="card">
        <div class="card-title">新規記録</div>
        <div class="input-group">
            <label for="distance">走行距離</label>
            <input type="number" id="distance" step="0.1" placeholder="例: 450.5">
            <span class="unit">km</span>
        </div>
        <div class="input-group">
            <label for="amount">給油量</label>
            <input type="number" id="amount" step="0.1" placeholder="例: 35.0">
            <span class="unit">L</span>
        </div>
        <button onclick="saveRecord()">データを計算・サーバーへ保存</button>
    </div>

    <div class="card">
        <div class="card-title">燃費記録履歴 (サーバー同期)</div>
        <ul id="recordList" class="record-list">
            </ul>
    </div>
</div>
