<!DOCTYPE html>
<script>
    // アップデート時は下の番号を変更してください
    const APP_VERSION = "Beta#1.01";
</script>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>燃費計算</title>
    
    <script> document.title = "燃費計算 (" + APP_VERSION + ")"; </script>

    <script src="config.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary-color: #007aff;
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-color: #1c1c1e;
            --accent-color: #34c759;
            --warning-color: #ff9500;
            --danger-color: #ff3b30;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .commit-badge {
            font-size: 16px;
            color: #8e8e93;
            font-weight: normal;
            margin-left: 10px;
        }

        .status-bar {
            font-size: 14px;
            color: #8e8e93;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .status-badge {
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 12px;
        }
        .status-connecting { background-color: #ffe5cc; color: var(--warning-color); }
        .status-connected { background-color: #e5f9eb; color: var(--accent-color); }
        .status-disconnected { background-color: #ffe5e5; color: var(--danger-color); }

        .status-error-text {
            font-size: 13px;
            color: var(--danger-color);
            background-color: #fff2f2;
            border-left: 3px solid var(--danger-color);
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            word-break: break-all;
            font-family: monospace;
            line-height: 1.4;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .input-group label {
            width: 90px;
            font-weight: 500;
        }

        .input-group input, .input-group select {
            flex: 1;
            padding: 10px;
            border: 1px solid #d1d1d6;
            border-radius: 8px;
            font-size: 16px;
            background-color: #fafafc;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .input-group select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238e8e93' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 16px;
            padding-right: 30px;
        }

        .input-group .unit {
            width: 45px;
            text-align: right;
            color: #8e8e93;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        .record-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e5e5ea;
        }

        .record-item:last-child {
            border-bottom: none;
        }

        .record-info .date {
            font-size: 12px;
            color: #8e8e93;
            margin-bottom: 4px;
        }

        .record-info .details {
            font-size: 14px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }

        .fuel-tag {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-color);
            background-color: #e5f9eb;
            padding: 1px 6px;
            border-radius: 4px;
        }
        
        .record-info .cost-tag {
            color: #555;
            font-weight: 600;
            background-color: #f2f2f7;
            padding: 1px 5px;
            border-radius: 4px;
        }

        .record-efficiency {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .efficiency-val {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-color);
        }

        .delete-btn {
            background: none;
            color: #ff3b30;
            border: none;
            padding: 5px;
            font-size: 14px;
            cursor: pointer;
            width: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>燃費計算<span class="commit-badge"><script>document.write(APP_VERSION);</script></span></h1>
    
    <div class="status-bar">
        通信状態: <span id="connectionStatus" class="status-badge status-connecting">🟡 接続中...</span>
    </div>
    
    <div id="statusErrorDisplay" class="status-error-text"></div>

    <div class="card">
        <div class="card-title">新規記録</div>
        <div class="input-group">
            <label for="distance">走行距離</label>
            <input type="number" id="distance" step="0.1" placeholder="例: 450.5">
            <span class="unit">km</span>
        </div>
        <div class="input-group">
            <label for="amount">給油量</label>
            <input type="number" id="amount" step="0.1" placeholder="例: 35.0">
            <span class="unit">L</span>
        </div>
        <div class="input-group">
            <label for="price">ガソリン単価</label>
            <input type="number" id="price" step="1" placeholder="例: 165">
            <span class="unit">円/L</span>
        </div>
        <div class="input-group">
            <label for="fuelType">油種</label>
            <select id="fuelType">
                <option value="レギュラー">レギュラー</option>
                <option value="ハイオク">ハイオク</option>
                <option value="軽油">軽油</option>
            </select>
            <span class="unit"></span>
        </div>
        <button onclick="saveRecord()">データを計算・サーバーへ保存</button>
    </div>

    <div class="card">
        <div class="card-title">燃費記録履歴 (サーバー同期)</div>
        <ul id="recordList" class="record-list">
            </ul>
    </div>
</div>

<script>
    let supabaseClient;
    let records = [];

    function cleanConfigStr(str) {
        if (!str) return '';
        return str.trim().replace(/\s+/g, '').replace(/\/$/, '');
    }

    function updateStatusDisplay(type, text, errorMsg = '') {
        const badge = document.getElementById('connectionStatus');
        const errorDisplay = document.getElementById('statusErrorDisplay');
        
        if (badge) {
            badge.innerText = text;
            badge.className = 'status-badge status-' + type;
        }
        
        if (errorDisplay) {
            if (errorMsg) {
                errorDisplay.innerText = "⚠️ エラー詳細: " + errorMsg;
                errorDisplay.style.display = 'block';
            } else {
                errorDisplay.innerText = "";
                errorDisplay.style.display = 'none';
            }
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        try {
            const hasConfig = (typeof SUPABASE_CONFIG_URL !== 'undefined' && typeof SUPABASE_CONFIG_ANON_KEY !== 'undefined');
            const cleanUrl = hasConfig ? cleanConfigStr(SUPABASE_CONFIG_URL) : '';
            const cleanKey = hasConfig ? cleanConfigStr(SUPABASE_CONFIG_ANON_KEY) : '';
            const isDefaultUrl = (cleanUrl.indexOf("YOUR_PROJECT_ID") !== -1 || cleanUrl === '');
            const lib = window.supabase || supabase;

            if (lib && hasConfig && !isDefaultUrl) {
                updateStatusDisplay('connecting', '🟡 接続中...');
                supabaseClient = lib.createClient(cleanUrl, cleanKey);
                loadFromServer();
            } else if (!lib) {
                updateStatusDisplay('disconnected', '🔴 未接続 (ライブラリの解析に失敗しました)');
            } else {
                updateStatusDisplay('disconnected', '🔴 未接続 (config.js の接続情報が未設定です)');
            }
        } catch (e) {
            updateStatusDisplay('disconnected', '🔴 未接続 (初期化失敗)', e.message);
        }
    });

    async function loadFromServer() {
        if (!supabaseClient) return;
        try {
            const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('サーバーの応答時間を超過しました')), 5000));
            const fetchPromise = supabaseClient.from('fuel_records').select('*').order('id', { ascending: false });

            const { data, error } = await Promise.race([fetchPromise, timeoutPromise]);

            if (!error) {
                records = data || [];
                updateLayout();
                updateStatusDisplay('connected', '🟢 接続完了');
            } else {
                updateStatusDisplay('disconnected', '🔴 未接続 (データ取得失敗)', error.message);
            }
        } catch (error) {
            updateStatusDisplay('disconnected', '🔴 未接続 (通信例外)', error.message);
        }
    }

    function updateLayout() {
        const listElement = document.getElementById('recordList');
        listElement.innerHTML = '';

        if (!records || records.length === 0) {
            listElement.innerHTML = '<li style="text-align:center; color:#8e8e93; padding:20px 0;">記録がありません</li>';
            return;
        }

        records.forEach((record, index) => {
            const li = document.createElement('li');
            li.className = 'record-item';
            const deleteAction = record.id ? `deleteRecord(${record.id})` : `removeLocalRecord(${index})`;
            
            let fuelTagText = '';
            if (record.fuel_type) {
                fuelTagText = `<span class="fuel-tag">${record.fuel_type}</span>`;
            }

            let costText = '';
            if (record.total_cost && record.total_cost > 0) {
                costText = `<span class="cost-tag">${Math.round(record.total_cost).toLocaleString()}円</span>`;
            } else if (record.price && record.amount) {
                costText = `<span class="cost-tag">${Math.round(record.price * record.amount).toLocaleString()}円</span>`;
            }

            li.innerHTML = `
                <div class="record-info">
                    <div class="date">${record.date}</div>
                    <div class="details">
                        <span>距離: ${record.distance}km / 給油: ${record.amount}L</span>
                        ${fuelTagText}
                        ${costText}
                    </div>
                </div>
                <div class="record-efficiency">
                    <span class="efficiency-val">${Number(record.efficiency).toFixed(2)} km/L</span>
                    <button class="delete-btn" onclick="${deleteAction}">削除</button>
                </div>
            `;
            listElement.appendChild(li);
        });
    }

    function saveRecord() {
        const distanceInput = document.getElementById('distance');
        const amountInput = document.getElementById('amount');
        const priceInput = document.getElementById('price');
        const fuelTypeInput = document.getElementById('fuelType');
        
        const distance = parseFloat(distanceInput.value);
        const amount = parseFloat(amountInput.value);
        const fuel_type = fuelTypeInput.value;
        let price = parseFloat(priceInput.value);

        if (isNaN(distance) || distance <= 0 || isNaN(amount) || amount <= 0) {
            alert('距離と給油量には、0より大きい正しい数値を入力してください。');
            return;
        }
        
        if (isNaN(price) || price < 0) {
            price = 0;
        }

        const now = new Date();
        const dateString = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        const efficiency = distance / amount;
        const total_cost = price * amount;

        const newRecord = { 
            date: dateString, 
            distance: distance, 
            amount: amount, 
            price: price,
            total_cost: total_cost,
            fuel_type: fuel_type,
            efficiency: efficiency 
        };
        
        records.unshift(newRecord);
        updateLayout();

        distanceInput.value = '';
        amountInput.value = '';
        priceInput.value = '';
        fuelTypeInput.value = 'レギュラー';

        if (supabaseClient) {
            updateStatusDisplay('connecting', '🟡 送信中...');
            supabaseClient
                .from('fuel_records')
                .insert([newRecord])
                .then(({ error }) => {
                    if (error) {
                        updateStatusDisplay('connected', '🟢 接続完了 (※DB側の項目列が未作成の可能性があります)');
                        console.log("サーバー保存スキップ（列未定義の可能性）:", error.message);
                    } else {
                        updateStatusDisplay('connected', '🟢 接続完了');
                        loadFromServer();
                    }
                })
                .catch((err) => {
                    updateStatusDisplay('disconnected', '🔴 未接続 (保存例外)', err.message);
                });
        }
    }

    async function deleteRecord(id) {
        if (confirm('この記録をサーバーから削除しますか？')) {
            if (!supabaseClient) {
                removeLocalRecord(0);
                return;
            }
            try {
                updateStatusDisplay('connecting', '🟡 削除中...');
                const { error } = await supabaseClient.from('fuel_records').delete().eq('id', id);
                if (error) {
                    updateStatusDisplay('disconnected', '🔴 未接続 (削除失敗)', error.message);
                } else {
                    updateStatusDisplay('connected', '🟢 接続完了');
                    loadFromServer();
                }
            } catch (error) {
                updateStatusDisplay('disconnected', '🔴 未接続 (削除例外)', error.message);
            }
        }
    }

    function removeLocalRecord(index) {
        records.splice(index, 1);
        updateLayout();
    }
</script>

</body>
</html>
