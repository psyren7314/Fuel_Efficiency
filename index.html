<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>燃費計算</title>
    
    <script> document.title = "燃費計算 (" + APP_VERSION + ")"; </script>

    <style>
        :root {
            --primary-color: #007aff;
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-color: #1c1c1e;
            --accent-color: #34c759;
            --warning-color: #ff9500;
            --danger-color: #ff3b30;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .status-bar {

        .status-badge {
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 12px;
        }
        .status-connecting { background-color: #ffe5cc; color: var(--warning-color); }
        .status-connected { background-color: #e5f9eb; color: var(--accent-color); }
        .status-disconnected { background-color: #ffe5e5; color: var(--danger-color); }

        .status-error-text {
            font-size: 13px;

            background-color: #fff2f2;

            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 15px;
        }

            display: flex;

            margin-bottom: 15px;
        }

        .input-group label {
            width: 90px;
            font-weight: 500;
        }

        .input-group input {
            flex: 1;
            padding: 10px;

            background-color: #fafafc;

        .record-item:last-child {

    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<body>

<div class="container">
    <h1>燃費計算<span class="commit-badge"><script>document.write(APP_VERSION);</script></span></h1>
    
    <div class="status-bar">
        通信状態: <span id="connectionStatus" class="status-badge status-connecting">🟡 接続中...</span>
    </div>
    
    <div id="statusErrorDisplay" class="status-error-text"></div>

    <div class="card">
        <div class="card-title">新規記録</div>
        <div class="input-group">
            <label for="distance">走行距離</label>
            <input type="number" id="distance" step="0.1" placeholder="例: 450.5">
            <span class="unit">km</span>
        </div>
        <div class="input-group">
            <label for="amount">給油量</label>
            <input type="number" id="amount" step="0.1" placeholder="例: 35.0">
            <span class="unit">L</span>
        </div>
        <button onclick="saveRecord()">データを計算・サーバーへ保存</button>
    </div>

    <div class="card">
        <div class="card-title">燃費記録履歴 (サーバー同期)</div>
        <ul id="recordList" class="record-list">
            </ul>
    </div>
</div>

<script>
    let supabaseClient; // 名前の競合を防ぐため一意の変数名に変更
    let records = [];

    // 文字列整形
    function cleanConfigStr(str) {
        if (!str) return '';
        return str.trim().replace(/\s+/g, '').replace(/\/$/, '');
    }

    // ステータス更新
    function updateStatusDisplay(type, text, errorMsg = '') {
        const badge = document.getElementById('connectionStatus');
        const errorDisplay = document.getElementById('statusErrorDisplay');
        
        if (badge) {
            badge.innerText = text;
            badge.className = 'status-badge status-' + type;
        }
        
        if (errorDisplay) {
            if (errorMsg) {
                errorDisplay.innerText = "⚠️ エラー詳細: " + errorMsg;
                errorDisplay.style.display = 'block';
            } else {
                errorDisplay.innerText = "";
                errorDisplay.style.display = 'none';
            }
        }
    }

    // 最新のライブラリ（v2）に対応した初期化処理
    window.addEventListener('DOMContentLoaded', () => {
        try {
            const cleanUrl = cleanConfigStr(SUPABASE_URL);
            const cleanKey = cleanConfigStr(SUPABASE_ANON_KEY);
            const isDefaultUrl = (cleanUrl.indexOf("YOUR_PROJECT_ID") !== -1 || cleanUrl === '');
            
            // window.supabase ではなく、CDNから直接読み込まれた supabase オブジェクトを参照
            const lib = window.supabase || supabase;

            if (lib && !isDefaultUrl) {
                updateStatusDisplay('connecting', '🟡 接続中...');
                supabaseClient = lib.createClient(cleanUrl, cleanKey);
                loadFromServer();
            } else if (!lib) {
                updateStatusDisplay('disconnected', '🔴 未接続 (ライブラリの解析に失敗しました)');
            } else {
                updateStatusDisplay('disconnected', '🔴 未接続 (接続情報が初期状態です)');
            }
        } catch (e) {
            updateStatusDisplay('disconnected', '🔴 未接続 (初期化失敗)', e.message);
        }
    });

    // サーバーからデータを取得
    async function loadFromServer() {
        if (!supabaseClient) return;
        try {
            const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('サーバーの応答時間を超過しました(タイムアウト)')), 5000));
            const fetchPromise = supabaseClient.from('fuel_records').select('*').order('id', { ascending: false });

            const { data, error } = await Promise.race([fetchPromise, timeoutPromise]);

            if (!error) {
                records = data || [];
                updateLayout();
                updateStatusDisplay('connected', '🟢 接続完了');
            } else {
                updateStatusDisplay('disconnected', '🔴 未接続 (データ取得失敗)', error.message);
            }
        } catch (error) {
            updateStatusDisplay('disconnected', '🔴 未接続 (通信例外)', error.message);
        }
    }

    // 画面表示更新
    function updateLayout() {
        const listElement = document.getElementById('recordList');
        listElement.innerHTML = '';

        if (!records || records.length === 0) {
            listElement.innerHTML = '<li style="text-align:center; color:#8e8e93; padding:20px 0;">記録がありません</li>';
            return;
        }

        records.forEach((record, index) => {
            const li = document.createElement('li');
            li.className = 'record-item';
            const deleteAction = record.id ? `deleteRecord(${record.id})` : `removeLocalRecord(${index})`;
            
            li.innerHTML = `
                <div class="record-info">
                    <div class="date">${record.date}</div>
                    <div class="details">距離: ${record.distance}km / 給油: ${record.amount}L</div>
                </div>
                <div class="record-efficiency">
                    <span class="efficiency-val">${Number(record.efficiency).toFixed(2)} km/L</span>
                    <button class="delete-btn" onclick="${deleteAction}">削除</button>
                </div>
            `;
            listElement.appendChild(li);
        });
    }

    // データ保存処理
    function saveRecord() {
        const distanceInput = document.getElementById('distance');
        const amountInput = document.getElementById('amount');
        
        const distance = parseFloat(distanceInput.value);
        const amount = parseFloat(amountInput.value);

        if (isNaN(distance) || distance <= 0 || isNaN(amount) || amount <= 0) {
            alert('距離と給油量には、0より大きい正しい数値を入力してください。');
            return;
        }

        const now = new Date();
        const dateString = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        const efficiency = distance / amount;

        const newRecord = { date: dateString, distance: distance, amount: amount, efficiency: efficiency };
        
        records.unshift(newRecord);
        updateLayout();

        distanceInput.value = '';
        amountInput.value = '';

        if (supabaseClient) {
            updateStatusDisplay('connecting', '🟡 送信中...');
            supabaseClient
                .from('fuel_records')
                .insert([newRecord])
                .then(({ error }) => {
                    if (error) {
                        updateStatusDisplay('disconnected', '🔴 未接続 (保存失敗)', error.message);
                    } else {
                        updateStatusDisplay('connected', '🟢 接続完了');
                        loadFromServer();
                    }
                })
                .catch((err) => {
                    updateStatusDisplay('disconnected', '🔴 未接続 (保存例外)', err.message);
                });
        }
    }

    // 削除処理
    async function deleteRecord(id) {
        if (confirm('この記録をサーバーから削除しますか？')) {
            if (!supabaseClient) {
                removeLocalRecord(0);
                return;
            }
            try {
                updateStatusDisplay('connecting', '🟡 削除中...');
                const { error } = await supabaseClient.from('fuel_records').delete().eq('id', id);
                if (error) {
                    updateStatusDisplay('disconnected', '🔴 未接続 (削除失敗)', error.message);
                } else {
                    updateStatusDisplay('connected', '🟢 接続完了');
                    loadFromServer();
                }
            } catch (error) {
                updateStatusDisplay('disconnected', '🔴 未接続 (削除例外)', error.message);
            }
        }
    }

    function removeLocalRecord(index) {
        records.splice(index, 1);
        updateLayout();
    }
</script>

</body>
</html>
