<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>燃費計算 - Supabase版</title>
    <style>
        :root {
            --primary-color: #007aff;
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-color: #1c1c1e;
            --accent-color: #34c759;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .input-group label {
            width: 90px;
            font-weight: 500;
        }

        .input-group input {
            flex: 1;
            padding: 10px;
            border: 1px solid #d1d1d6;
            border-radius: 8px;
            font-size: 16px;
            background-color: #fafafc;
        }

        .input-group .unit {
            width: 40px;
            text-align: right;
            color: #8e8e93;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        .record-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e5e5ea;
        }

        .record-item:last-child {
            border-bottom: none;
        }

        .record-info .date {
            font-size: 12px;
            color: #8e8e93;
            margin-bottom: 4px;
        }

        .record-info .details {
            font-size: 14px;
        }

        .record-efficiency {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .efficiency-val {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-color);
        }

        .delete-btn {
            background: none;
            color: #ff3b30;
            border: none;
            padding: 5px;
            font-size: 14px;
            cursor: pointer;
            width: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>燃費計算</h1>

    <div class="card">
        <div class="card-title">新規記録</div>
        <div class="input-group">
            <label for="distance">走行距離</label>
            <input type="number" id="distance" step="0.1" placeholder="例: 450.5">
            <span class="unit">km</span>
        </div>
        <div class="input-group">
            <label for="amount">給油量</label>
            <input type="number" id="amount" step="0.1" placeholder="例: 35.0">
            <span class="unit">L</span>
        </div>
        <button onclick="saveRecord()">データを計算・サーバーへ保存</button>
    </div>

    <div class="card">
        <div class="card-title">燃費記録履歴 (サーバー同期)</div>
        <ul id="recordList" class="record-list">
            </ul>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // 1. 各自のSupabase接続情報をここに貼り付けます
    const SUPABASE_URL = "https://jpdpoxrwugqeobkbyhzw.supabase.co/rest/v1/"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpwZHBveHJ3dWdxZW9ia2J5aHp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MTQyNTUsImV4cCI6MjA5NzE5MDI1NX0.6bmXeAWZ5bZVa7oPT6upM3_CpXoHIeU8fIYwGiT9scw";

    // Supabaseクライアントの初期化
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let records = [];

    // サーバー（Supabase）からデータを取得する
    async function loadFromServer() {
        const listElement = document.getElementById('recordList');
        listElement.innerHTML = '<li style="text-align:center; color:#8e8e93; padding:20px 0;">読み込み中...</li>';

        try {
            // fuel_recordsテーブルから、idを基準に降順（最新順）で取得
            const { data, error } = await supabase
                .from('fuel_records')
                .select('*')
                .order('id', { ascending: false });

            if (error) throw error;

            records = data;
            updateLayout();
        } catch (error) {
            console.error("データ取得失敗:", error);
            listElement.innerHTML = '<li style="text-align:center; color:#ff3b30; padding:20px 0;">データの取得に失敗しました</li>';
        }
    }

    // 画面の表示更新
    function updateLayout() {
        const listElement = document.getElementById('recordList');
        listElement.innerHTML = '';

        if (!records || records.length === 0) {
            listElement.innerHTML = '<li style="text-align:center; color:#8e8e93; padding:20px 0;">記録がありません</li>';
            return;
        }

        records.forEach((record) => {
            const li = document.createElement('li');
            li.className = 'record-item';
            li.innerHTML = `
                <div class="record-info">
                    <div class="date">${record.date}</div>
                    <div class="details">距離: ${record.distance}km / 給油: ${record.amount}L</div>
                </div>
                <div class="record-efficiency">
                    <span class="efficiency-val">${record.efficiency.toFixed(2)} km/L</span>
                    <button class="delete-btn" onclick="deleteRecord(${record.id})">削除</button>
                </div>
            `;
            listElement.appendChild(li);
        });
    }

    // データを計算してサーバーへ保存
    async function saveRecord() {
        const distanceInput = document.getElementById('distance');
        const amountInput = document.getElementById('amount');
        
        const distance = parseFloat(distanceInput.value);
        const amount = parseFloat(amountInput.value);

        if (isNaN(distance) || distance <= 0 || isNaN(amount) || amount <= 0) {
            alert('距離と給油量には、0より大きい正しい数値を入力してください。');
            return;
        }

        // 日時フォーマットの作成
        const now = new Date();
        const dateString = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        
        // 燃費の計算
        const efficiency = distance / amount;

        try {
            // Supabaseへデータを挿入(Insert)
            const { error } = await supabase
                .from('fuel_records')
                .insert([
                    { date: dateString, distance: distance, amount: amount, efficiency: efficiency }
                ]);

            if (error) throw error;

            // 入力欄をクリアして再読み込み
            distanceInput.value = '';
            amountInput.value = '';
            loadFromServer();
            
        } catch (error) {
            // エラー内容をポップアップで強制的に表示させる
            alert("エラーが発生しました: " + JSON.stringify(error));
            console.error(error);
        }
    }

    // データの削除
    async function deleteRecord(id) {
        if (confirm('この記録をサーバーから削除しますか？')) {
            try {
                const { error } = await supabase
                    .from('fuel_records')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                loadFromServer();
            } catch (error) {
                alert("データの削除に失敗しました。");
                console.error(error);
            }
        }
    }

    // アプリ起動時にデータを読み込む
    loadFromServer();
</script>

</body>
</html>
